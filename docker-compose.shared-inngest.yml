# Overlay for SHARED-Inngest deployments: attaches AO containers to an
# existing external Docker network (default: the RAAS stack's
# raas-deploy-next_default) so AO, the shared raas-inngest and the partner
# postgres resolve each other by container/service name.
#
# Use together with the main file:
#   docker compose --env-file .env.deploy \
#     -f docker-compose.deploy.yml -f docker-compose.shared-inngest.yml up -d --wait
#
# Pair it with these .env.deploy settings:
#   COMPOSE_PROFILES=                                   # bundled inngest OFF
#   INNGEST_BASE_URL=http://raas-inngest:8288           # shared instance
#   INNGEST_SERVE_ORIGIN=http://ao-v2-app:3002          # our alias below
#   RAAS_POSTGRES_URL=postgresql://user:pass@postgres:5432/raas
#
# Not needed when the shared services publish host ports — in that case the
# main file alone works with host.docker.internal URLs instead.

services:
  app:
    networks:
      default:
      raas-shared:
        # Distinctive alias: "app" would be ambiguous on a shared network.
        aliases: [ao-v2-app]
  archiver:
    networks:
      default:
      raas-shared: {}

networks:
  raas-shared:
    external: true
    name: ${RAAS_SHARED_NETWORK:-raas-deploy-next_default}
