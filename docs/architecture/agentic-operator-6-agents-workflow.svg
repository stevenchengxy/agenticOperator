<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1680" viewBox="0 0 1920 1680" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Operator six production agents business workflow and event flow</title>
  <desc id="desc">Visual map of Create JD, Resume Parser, Candidate Dedup, Rule Check, Match Resume, and Interview Inviter agents, including their trigger events, emitted events, external systems, persistence writes, and failure branches.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #dbe4ef; stroke-width: 1.5; }
      .lane-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .body { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .body-strong { font: 800 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; }
      .node-title { font: 800 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .agent { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; filter: url(#soft-shadow); }
      .event { fill: #ecfeff; stroke: #0891b2; stroke-width: 1.8; filter: url(#soft-shadow); }
      .source { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; filter: url(#soft-shadow); }
      .store { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; filter: url(#soft-shadow); }
      .stop { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; filter: url(#soft-shadow); }
      .park { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; filter: url(#soft-shadow); }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .edge-red { fill: none; stroke: #dc2626; stroke-width: 2.2; marker-end: url(#arrow-red); }
      .edge-dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #94a3b8; stroke-width: 1.8; marker-end: url(#arrow); }
      .pill { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 1; }
      .pill-text { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="1680"/>
  <text class="title" x="60" y="58">Agentic Operator: 6 个真实 Inngest Agents 的业务工作流与事件流</text>
  <text class="subtitle" x="60" y="86">当前代码口径: RAAS-v1 recruitment app, app id = agentic-operator-main. Stub agents 和跨域 demo agents 不在此图内。</text>

  <g transform="translate(1240 36)">
    <rect class="agent" x="0" y="0" width="118" height="34" rx="8"/>
    <text class="pill-text" x="16" y="22">Agent</text>
    <rect class="event" x="134" y="0" width="118" height="34" rx="8"/>
    <text class="pill-text" x="150" y="22">Event</text>
    <rect class="source" x="268" y="0" width="118" height="34" rx="8"/>
    <text class="pill-text" x="284" y="22">External</text>
    <rect class="store" x="402" y="0" width="118" height="34" rx="8"/>
    <text class="pill-text" x="418" y="22">Write/Read</text>
  </g>

  <rect class="lane" x="40" y="120" width="1840" height="250" rx="18"/>
  <text class="lane-title" x="64" y="150">A. 需求 / JD 生成支线</text>

  <rect class="source" x="64" y="185" width="245" height="112" rx="12"/>
  <text class="node-title" x="84" y="213">RAAS / HSM</text>
  <text class="body" x="84" y="238">需求录入、澄清完成</text>
  <text class="body" x="84" y="260">或 JD 审核驳回后重生</text>
  <text class="mono" x="84" y="282">Job_Requisition anchor</text>

  <rect class="event" x="350" y="192" width="250" height="96" rx="14"/>
  <text class="node-title" x="374" y="220">Trigger events</text>
  <text class="mono" x="374" y="244">REQUIREMENT_LOGGED</text>
  <text class="mono" x="374" y="264">CLARIFICATION_READY</text>
  <text class="mono" x="374" y="284">JD_REJECTED</text>

  <rect class="agent" x="640" y="170" width="280" height="140" rx="14"/>
  <text class="node-title" x="664" y="199">Create JD Agent</text>
  <text class="mono" x="664" y="222">id: create-jd-agent</text>
  <text class="tiny" x="664" y="242">server/inngest/agents/create-jd-agent.ts</text>
  <text class="body" x="664" y="267">拉需求 + 澄清记录</text>
  <text class="body" x="664" y="288">生成 JD, 回填 posting</text>

  <rect class="store" x="962" y="146" width="300" height="188" rx="14"/>
  <text class="node-title" x="986" y="176">Reads / calls / writes</text>
  <text class="body" x="986" y="204">Partner PG: getRequirementDetail</text>
  <text class="body" x="986" y="226">Partner PG: getClarificationRecords</text>
  <text class="body" x="986" y="248">RoboHire: /jobs/generate-jd</text>
  <text class="body" x="986" y="270">Partner PG: syncJdToPartnerPg</text>
  <text class="body" x="986" y="292">Allmeta: Job_Requisition / Posting</text>
  <text class="body" x="986" y="314">Notification: JD lifecycle</text>

  <rect class="event" x="1300" y="195" width="220" height="90" rx="14"/>
  <text class="node-title" x="1324" y="224">Emit</text>
  <text class="mono" x="1324" y="250">JD_GENERATED</text>
  <text class="tiny" x="1324" y="272">Job_Posting envelope</text>

  <rect class="source" x="1550" y="178" width="180" height="124" rx="12"/>
  <text class="node-title" x="1570" y="207">RAAS 下游</text>
  <text class="body" x="1570" y="232">JD 审核 / 发布</text>
  <text class="body" x="1570" y="254">JobPosting 可匹配</text>
  <text class="body" x="1570" y="276">招聘员认领岗位</text>

  <path class="edge" d="M309 241 H350"/>
  <path class="edge-blue" d="M600 241 H640"/>
  <path class="edge" d="M920 241 H962"/>
  <path class="edge-blue" d="M1262 241 H1300"/>
  <path class="edge" d="M1520 241 H1550"/>

  <rect class="lane" x="40" y="405" width="1840" height="275" rx="18"/>
  <text class="lane-title" x="64" y="435">B. 简历入口 / 解析 / 候选人查重</text>

  <rect class="source" x="64" y="482" width="245" height="118" rx="12"/>
  <text class="node-title" x="84" y="510">RAAS + MinIO</text>
  <text class="body" x="84" y="535">上传简历, 写 resume_upload</text>
  <text class="body" x="84" y="557">原文对象在 MinIO</text>
  <text class="mono" x="84" y="580">upload_id / bucket / object_key</text>

  <rect class="event" x="350" y="496" width="250" height="90" rx="14"/>
  <text class="node-title" x="374" y="525">Trigger</text>
  <text class="mono" x="374" y="552">RESUME_DOWNLOADED</text>
  <text class="tiny" x="374" y="574">transport metadata only</text>

  <rect class="agent" x="640" y="445" width="305" height="190" rx="14"/>
  <text class="node-title" x="664" y="474">Resume Parser Agent</text>
  <text class="mono" x="664" y="497">id: resume-parser-agent</text>
  <text class="tiny" x="664" y="517">server/inngest/agents/resume-parser-agent.ts</text>
  <text class="body" x="664" y="544">MinIO 下载; docx 转 PDF</text>
  <text class="body" x="664" y="566">RoboHire /parse-resume</text>
  <text class="body" x="664" y="588">落 Partner PG Candidate/Resume</text>
  <text class="body" x="664" y="610">写 Allmeta Candidate/Resume</text>

  <rect class="agent" x="992" y="438" width="320" height="150" rx="14"/>
  <text class="node-title" x="1016" y="467">候选人查重</text>
  <text class="mono" x="1016" y="490">id: rule-check-candidate-identity-agent</text>
  <text class="tiny" x="1016" y="510">candidate-identity-agent.ts</text>
  <text class="body" x="1016" y="536">step.invoke: 落库前同步判定</text>
  <text class="body" x="1016" y="558">三级规则 + AI 字段等价</text>

  <rect class="store" x="992" y="610" width="320" height="52" rx="12"/>
  <text class="body" x="1016" y="641">返回 sameAsCandidateId, 落 OntologyRuleCheck 审计</text>

  <rect class="event" x="1360" y="470" width="250" height="95" rx="14"/>
  <text class="node-title" x="1384" y="499">Emit</text>
  <text class="mono" x="1384" y="526">RESUME_PROCESSED</text>
  <text class="tiny" x="1384" y="548">candidate_id / resume_id / parsed</text>

  <rect class="stop" x="1360" y="590" width="250" height="62" rx="12"/>
  <text class="body-strong" x="1384" y="619">Lock-only 分支</text>
  <text class="mono" x="1384" y="642">RESUME_LOCKED_CONFLICT</text>

  <rect class="event" x="1530" y="405" width="250" height="64" rx="12"/>
  <text class="mono" x="1550" y="431">CANDIDATE_IDENTITY_</text>
  <text class="mono" x="1550" y="451">CHECKED</text>

  <path class="edge" d="M309 541 H350"/>
  <path class="edge-blue" d="M600 541 H640"/>
  <path class="edge-blue" d="M945 513 H992"/>
  <path class="edge-dash" d="M1128 438 C1128 400 1408 390 1530 431"/>
  <path class="edge-blue" d="M1312 520 H1360"/>
  <path class="edge-red" d="M945 610 C1060 696 1288 675 1360 627"/>

  <rect class="lane" x="40" y="715" width="1840" height="320" rx="18"/>
  <text class="lane-title" x="64" y="745">C. 规则校验 fan-out: 对每个候选 JR 先做硬门槛审查</text>

  <rect class="note" x="64" y="795" width="270" height="170" rx="12"/>
  <text class="node-title" x="88" y="824">JR 收敛路径</text>
  <text class="body" x="88" y="852">Path A: event.job_requisition_id</text>
  <text class="body" x="88" y="876">Path B': event.job_requisition_ids[]</text>
  <text class="body" x="88" y="900">Path B: 招聘员已发布/认领岗位</text>
  <text class="body" x="88" y="928">thin event 时回拉 parsed resume</text>
  <text class="tiny" x="88" y="952">无岗位或无可用简历内容会早退</text>

  <rect class="agent" x="390" y="775" width="330" height="210" rx="14"/>
  <text class="node-title" x="414" y="805">Rule Check Agent</text>
  <text class="mono" x="414" y="828">id: rule-check-agent</text>
  <text class="tiny" x="414" y="848">server/inngest/agents/rule-check-agent.ts</text>
  <text class="body" x="414" y="875">trigger: RESUME_PROCESSED</text>
  <text class="body" x="414" y="899">per-JR loop: write JR to Allmeta</text>
  <text class="body" x="414" y="923">runRuleCheck 后写 audit / flags</text>
  <text class="body" x="414" y="947">PASS 才进入匹配</text>

  <rect class="store" x="770" y="775" width="320" height="210" rx="14"/>
  <text class="node-title" x="794" y="805">Rule engine / persistence</text>
  <text class="body" x="794" y="834">Ontology + Neo4j + LLM</text>
  <text class="body" x="794" y="858">Prisma RuleCheckAudit / Flag</text>
  <text class="body" x="794" y="882">Allmeta Candidate_Match_Result</text>
  <text class="body" x="794" y="906">FAIL: Partner PG CMR stage=rule_check</text>
  <text class="body" x="794" y="930">Infra failure: PARKED audit + alert</text>
  <text class="tiny" x="794" y="956">基础设施失败不拒绝候选人</text>

  <rect class="event" x="1140" y="760" width="280" height="82" rx="14"/>
  <text class="node-title" x="1164" y="789">PASS emit</text>
  <text class="mono" x="1164" y="815">MATCH_RULE_CHECK_PASSED</text>

  <rect class="stop" x="1140" y="862" width="280" height="82" rx="14"/>
  <text class="node-title" x="1164" y="891">Business FAIL emit</text>
  <text class="mono" x="1164" y="917">MATCH_RULE_CHECK_FAILED</text>

  <rect class="park" x="1140" y="964" width="280" height="52" rx="12"/>
  <text class="body-strong" x="1164" y="996">PARK / retry, no reject</text>

  <rect class="source" x="1490" y="792" width="220" height="150" rx="12"/>
  <text class="node-title" x="1514" y="821">下游语义</text>
  <text class="body" x="1514" y="849">通过: 进入 match</text>
  <text class="body" x="1514" y="873">未通过: 停止此 JR</text>
  <text class="body" x="1514" y="897">故障: 等恢复重放</text>
  <text class="tiny" x="1514" y="922">每个 JR 独立处理</text>

  <path class="edge-dash" d="M1640 302 C1640 520 220 578 220 795"/>
  <text class="tiny" x="1458" y="520">已发布 JobPosting / 认领关系供 Path B 使用</text>
  <path class="edge-blue" d="M1485 565 C1485 700 720 685 555 775"/>
  <text class="tiny" x="1150" y="704">RESUME_PROCESSED</text>
  <path class="edge" d="M334 880 H390"/>
  <path class="edge-blue" d="M720 880 H770"/>
  <path class="edge-blue" d="M1090 817 H1140"/>
  <path class="edge-red" d="M1090 895 H1140"/>
  <path class="edge-dash" d="M1090 970 H1140"/>
  <path class="edge" d="M1420 804 H1490"/>
  <path class="edge-red" d="M1420 903 H1490"/>
  <path class="edge-dash" d="M1420 990 C1460 990 1464 910 1490 910"/>

  <rect class="lane" x="40" y="1070" width="1840" height="280" rx="18"/>
  <text class="lane-title" x="64" y="1100">D. 简历匹配: 只有真实规则通过的候选人才能调用 RoboHire match</text>

  <rect class="event" x="64" y="1165" width="270" height="88" rx="14"/>
  <text class="node-title" x="88" y="1194">Trigger</text>
  <text class="mono" x="88" y="1221">MATCH_RULE_CHECK_PASSED</text>
  <text class="tiny" x="88" y="1243">含 job_requisition + parsed_resume</text>

  <rect class="agent" x="390" y="1130" width="330" height="178" rx="14"/>
  <text class="node-title" x="414" y="1160">Match Resume Agent</text>
  <text class="mono" x="414" y="1183">id: match-resume-agent</text>
  <text class="tiny" x="414" y="1203">server/inngest/agents/match-resume-agent.ts</text>
  <text class="body" x="414" y="1230">verify rule-check gate</text>
  <text class="body" x="414" y="1254">构造 resume text + JD text</text>
  <text class="body" x="414" y="1278">附加 rule-check 结果到 JD</text>

  <rect class="store" x="770" y="1130" width="320" height="178" rx="14"/>
  <text class="node-title" x="794" y="1160">Match calls / writes</text>
  <text class="body" x="794" y="1189">RoboHire: /match-resume</text>
  <text class="body" x="794" y="1213">Partner PG: saveMatchResults</text>
  <text class="body" x="794" y="1237">Allmeta: CMR overall_* upsert</text>
  <text class="body" x="794" y="1261">Recoverable degrade: park/retry</text>
  <text class="tiny" x="794" y="1286">NO_INTERVIEW 自动分支当前下线</text>

  <rect class="event" x="1140" y="1110" width="300" height="88" rx="14"/>
  <text class="node-title" x="1164" y="1139">Score null or score ≥ 40</text>
  <text class="mono" x="1164" y="1166">MATCH_PASSED_NEED_INTERVIEW</text>
  <text class="tiny" x="1164" y="1188">进入 RAAS/HSM 邀约决策</text>

  <rect class="stop" x="1140" y="1218" width="300" height="74" rx="14"/>
  <text class="node-title" x="1164" y="1247">Score &lt; 40 / non-recoverable error</text>
  <text class="mono" x="1164" y="1274">MATCH_FAILED</text>

  <rect class="source" x="1490" y="1135" width="220" height="130" rx="12"/>
  <text class="node-title" x="1514" y="1164">RAAS / HSM</text>
  <text class="body" x="1514" y="1190">自动邀约规则</text>
  <text class="body" x="1514" y="1214">或人工审批/触发</text>
  <text class="mono" x="1514" y="1236">INTERVIEW_INVITATION_</text>
  <text class="mono" x="1514" y="1255">REQUESTED</text>

  <path class="edge-blue" d="M1280 842 C1280 1035 220 1040 198 1165"/>
  <path class="edge-blue" d="M334 1210 H390"/>
  <path class="edge-blue" d="M720 1219 H770"/>
  <path class="edge-blue" d="M1090 1154 H1140"/>
  <path class="edge-red" d="M1090 1255 H1140"/>
  <path class="edge" d="M1440 1154 H1490"/>

  <rect class="lane" x="40" y="1385" width="1840" height="245" rx="18"/>
  <text class="lane-title" x="64" y="1415">E. 面试邀约: RAAS 决策后回调 AO 发出 RoboHire / GoHire 邀请</text>

  <rect class="event" x="64" y="1472" width="300" height="88" rx="14"/>
  <text class="node-title" x="88" y="1501">Trigger</text>
  <text class="mono" x="88" y="1528">INTERVIEW_INVITATION_REQUESTED</text>
  <text class="tiny" x="88" y="1550">RAAS envelope; may be thin</text>

  <rect class="agent" x="420" y="1438" width="330" height="165" rx="14"/>
  <text class="node-title" x="444" y="1468">Interview Inviter Agent</text>
  <text class="mono" x="444" y="1491">id: interview-inviter-agent</text>
  <text class="tiny" x="444" y="1511">server/inngest/agents/interview-inviter-agent.ts</text>
  <text class="body" x="444" y="1538">必要时回拉 resume / JD</text>
  <text class="body" x="444" y="1562">调用 RoboHire invite-candidate</text>
  <text class="body" x="444" y="1586">写面试记录和沟通日志</text>

  <rect class="store" x="800" y="1438" width="330" height="165" rx="14"/>
  <text class="node-title" x="824" y="1468">Invite calls / writes</text>
  <text class="body" x="824" y="1497">Partner PG backfill resume/JD</text>
  <text class="body" x="824" y="1521">RoboHire: /invite-candidate</text>
  <text class="body" x="824" y="1545">Allmeta: Interview_Record</text>
  <text class="body" x="824" y="1569">Allmeta: Communication_Log</text>
  <text class="body" x="824" y="1593">Partner PG: invitation sent update</text>

  <rect class="event" x="1180" y="1438" width="300" height="76" rx="14"/>
  <text class="node-title" x="1204" y="1467">Success emit</text>
  <text class="mono" x="1204" y="1494">INTERVIEW_INVITATION_SENT</text>

  <rect class="stop" x="1180" y="1530" width="300" height="76" rx="14"/>
  <text class="node-title" x="1204" y="1559">Terminal failure emit</text>
  <text class="mono" x="1204" y="1586">INTERVIEW_INVITATION_FAILED</text>

  <rect class="source" x="1530" y="1464" width="190" height="116" rx="12"/>
  <text class="node-title" x="1554" y="1493">RAAS UI / 后续流</text>
  <text class="body" x="1554" y="1519">候选人收到链接</text>
  <text class="body" x="1554" y="1543">失败进入重试/人工</text>
  <text class="body" x="1554" y="1567">后续 AI 面试 agent</text>

  <path class="edge" d="M1600 1265 C1600 1370 220 1365 214 1472"/>
  <path class="edge-blue" d="M364 1516 H420"/>
  <path class="edge-blue" d="M750 1521 H800"/>
  <path class="edge-blue" d="M1130 1476 H1180"/>
  <path class="edge-red" d="M1130 1568 H1180"/>
  <path class="edge" d="M1480 1476 H1530"/>
  <path class="edge-red" d="M1480 1568 H1530"/>

  <rect class="note" x="60" y="1640" width="1800" height="1" rx="0"/>
  <g transform="translate(60 1608)">
    <rect class="pill" x="0" y="-22" width="118" height="30" rx="15"/>
    <text class="pill-text" x="16" y="-3">代码事实</text>
    <text class="tiny" x="135" y="-8">6 个 function ids: create-jd-agent, resume-parser-agent, rule-check-candidate-identity-agent, rule-check-agent,</text>
    <text class="tiny" x="135" y="10">match-resume-agent, interview-inviter-agent.</text>
  </g>
